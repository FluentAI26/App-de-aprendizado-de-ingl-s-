<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="FluentAI — Aprenda inglês do zero ao avançado com IA adaptativa"/>
<title>FluentAI — English Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:'DM Sans',sans-serif;background:#08080f;color:#e2e0f0;min-height:100vh;line-height:1.5}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#2d2a40;border-radius:2px}
#app{display:flex;flex-direction:column;min-height:100vh}
.header{background:#060610;border-bottom:1px solid #1a1828;padding:0 20px;position:sticky;top:0;z-index:100}
.header-inner{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px;gap:8px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer}
.logo-icon{width:30px;height:30px;background:#5b21b6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#e9d5ff;flex-shrink:0}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:#e2e0f0;letter-spacing:-0.02em}
.logo-text span{color:#a78bfa}
.header-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.level-select{background:#111118;border:1px solid #2d2a40;color:#a78bfa;padding:4px 9px;border-radius:8px;font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.streak-pill{display:flex;align-items:center;gap:5px;background:#1e1a2e;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;color:#fcd34d}
.xp-pill{font-size:12px;color:#888;background:#111118;padding:4px 10px;border-radius:8px;border:1px solid #1e1e2a}
.user-pill{font-size:12px;color:#a78bfa;background:#1a1630;padding:4px 10px;border-radius:8px;border:1px solid #2d2a40;cursor:pointer}
.tabs{background:#060610;border-bottom:1px solid #1a1828;padding:0 20px;overflow-x:auto}
.tabs-inner{max-width:920px;margin:0 auto;display:flex;gap:2px;padding:5px 0}
.tab{background:none;border:none;cursor:pointer;padding:7px 11px;border-radius:9px;color:#555;font-size:11px;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tab:hover{color:#bbb;background:#14121e}
.tab.active{color:#a78bfa;background:#1a1630;font-weight:500}
.main{flex:1;padding:22px 20px 40px}
.content{max-width:920px;margin:0 auto}
.card{background:#0f0f1a;border:1px solid #1a1828;border-radius:14px;padding:20px;margin-bottom:14px}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
.page-sub{font-size:13px;color:#6b7280;margin-bottom:20px}
.btn{border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:9px 18px}
.btn:active{transform:scale(.97)}
.btn-primary{background:#5b21b6;color:#e9d5ff}.btn-primary:hover{background:#6d28d9}
.btn-secondary{background:#141222;color:#a78bfa;border:1px solid #2d2a40;font-size:13px;padding:7px 14px}.btn-secondary:hover{background:#1e1a2e}
.btn-success{background:#064e3b;color:#6ee7b7}.btn-success:hover{background:#065f46}
.btn-easy{background:#064e3b;color:#6ee7b7;flex:1;justify-content:center}
.btn-medium{background:#451a03;color:#fcd34d;flex:1;justify-content:center}
.btn-hard{background:#1f0e0e;color:#f87171;border:1px solid #450a0a;flex:1;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{font-size:12px;padding:5px 12px}
.progress-wrap{background:#141222;border-radius:99px;overflow:hidden;height:6px}
.progress-bar{height:100%;border-radius:99px;background:#7c3aed;transition:width .5s ease}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#0c0c18;border:1px solid #1a1828;border-radius:12px;padding:14px;text-align:center}
.stat-val{font-size:20px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:#a78bfa}
.stat-label{font-size:11px;font-weight:500;margin-top:3px;color:#ccc}
.stat-sub{font-size:10px;color:#555;margin-top:1px}
.mission-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:12px;background:#0c0c18;border:1px solid #1a1828;margin-bottom:8px;transition:all .2s}
.mission-item.done{border-color:#065f46;background:#031710}
.check-circle{width:22px;height:22px;border-radius:50%;border:2px solid #2d2a40;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;cursor:pointer;transition:all .2s;color:transparent}
.check-circle.done{background:#059669;border-color:#059669;color:#fff}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge-purple{background:#1e1a2e;color:#a78bfa}
.badge-green{background:#064e3b;color:#6ee7b7}
.badge-amber{background:#451a03;color:#fcd34d}
.badge-blue{background:#0c2740;color:#60a5fa}
.perf-bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.perf-label{width:82px;font-size:12px;color:#888}
.perf-pct{width:30px;font-size:12px;color:#666;text-align:right}
.chat-area{overflow-y:auto;background:#07070f;border-radius:13px;border:1px solid #1a1828;padding:14px;min-height:220px;max-height:380px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.bubble{max-width:84%;padding:10px 14px;border-radius:13px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word;position:relative}
.bubble-user{background:#1e1a2e;color:#c4b5fd;border-bottom-right-radius:4px;align-self:flex-end}
.bubble-ai{background:#0f0f1a;border:1px solid #1a1828;color:#e2e0f0;border-bottom-left-radius:4px;align-self:flex-start}
.bubble-speak-btn{position:absolute;bottom:6px;right:8px;background:none;border:none;cursor:pointer;font-size:13px;color:#555;padding:2px 4px;border-radius:4px;transition:color .2s}
.bubble-speak-btn:hover{color:#a78bfa}
.voice-btn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0}
.voice-idle{background:#141222;color:#888;border:1px solid #2d2a40}.voice-idle:hover{background:#1e1a2e;color:#a78bfa}
.voice-recording{background:#7c3aed;color:#fff;animation:vp 1.2s infinite}
@keyframes vp{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.5)}50%{box-shadow:0 0 0 8px rgba(124,58,237,0)}}
.inp{background:#0c0c18;border:1px solid #2d2a40;border-radius:10px;color:#e2e0f0;font-family:inherit;font-size:13px;padding:10px 13px;width:100%;outline:none;resize:vertical}
.inp:focus{border-color:#5b21b6}
.inp-number{background:#0c0c18;border:1px solid #2d2a40;border-radius:10px;color:#e2e0f0;font-family:inherit;font-size:13px;padding:8px 12px;outline:none;width:90px}
.inp-number:focus{border-color:#5b21b6}
.success-box{background:#031710;border:1px solid #065f46;border-radius:10px;padding:13px;margin-top:10px}
.word-of-day{background:#0f0f1a;border:1px solid #3d1d6b;border-radius:14px;padding:20px;margin-bottom:14px}
.onboarding-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;overflow-y:auto}
.onboarding-card{background:#0f0f1a;border:1px solid #2d2a40;border-radius:20px;padding:30px;max-width:460px;width:100%}
.levels-row{display:flex;justify-content:space-between;margin-top:10px}
.level-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.level-dot{width:9px;height:9px;border-radius:50%}
.text-box{background:#07070f;border:1px solid #1a1828;border-radius:10px;padding:14px;line-height:1.8;font-size:14px;color:#c4b5fd;margin-bottom:12px}
.chunk-item{display:flex;align-items:center;gap:10px;padding:9px 13px;background:#0c0c18;border-radius:10px;border:1px solid #1a1828;margin-bottom:7px}
.topic-btn{background:#141222;border:1px solid #2d2a40;color:#a78bfa;border-radius:8px;padding:6px 12px;font-size:11px;font-family:inherit;cursor:pointer;transition:all .2s}
.topic-btn:hover{background:#1e1a2e;border-color:#5b21b6}
.topic-btn.sel{background:#1e1a2e;border-color:#7c3aed;color:#c4b5fd}
.speed-btn{background:#141222;border:1px solid #2d2a40;color:#888;border-radius:6px;padding:4px 10px;font-size:11px;font-family:inherit;cursor:pointer;transition:all .2s}
.speed-btn:hover{color:#a78bfa}.speed-btn.sel{background:#1e1a2e;border-color:#5b21b6;color:#a78bfa}
.goal-btn{background:#141222;border:1px solid #2d2a40;color:#888;border-radius:8px;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s;text-align:center}
.goal-btn:hover{color:#a78bfa;border-color:#5b21b6}.goal-btn.sel{background:#1e1a2e;border-color:#7c3aed;color:#a78bfa}
.timer-bar{background:#141222;border-radius:99px;overflow:hidden;height:4px;margin-top:6px}
.timer-fill{height:100%;border-radius:99px;background:#a78bfa;transition:width 1s linear}
.celebrate{background:#1a1630;border:1px solid #5b21b6;border-radius:14px;padding:22px;text-align:center;margin-bottom:14px}
.filter-btn{background:#141222;border:1px solid #2d2a40;color:#888;border-radius:8px;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s}
.filter-btn:hover{color:#a78bfa;border-color:#5b21b6}.filter-btn.sel{background:#1e1a2e;border-color:#7c3aed;color:#a78bfa}
.activity-day{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#555;flex-direction:column;gap:1px}
.lesson-step{background:#0c0c18;border:1px solid #1a1828;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:all .2s}
.lesson-step.active{border-color:#5b21b6;background:#0f0a1e}
.lesson-step.done{border-color:#065f46;background:#031710}
.fb-card{border-radius:12px;overflow:hidden;margin-bottom:10px}
.fb-main{padding:13px 15px;cursor:default}
.fb-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fb-text{font-size:13px;line-height:1.7;color:#e2e0f0;white-space:pre-wrap}
.fb-toggle{width:100%;background:#0a0a15;border:none;border-top:1px solid #1a1828;color:#6b7280;font-size:11px;padding:8px 15px;cursor:pointer;text-align:left;font-family:inherit;transition:color .2s}
.fb-toggle:hover{color:#a78bfa}
.fb-details{background:#07070f;border-top:1px solid #1a1828;padding:13px 15px;display:none}
.fb-details.open{display:block}
.fb-detail-row{margin-bottom:10px}
.fb-detail-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.fb-detail-text{font-size:12px;line-height:1.7;color:#d1d5db;white-space:pre-wrap}
.fb-speak-btn{background:none;border:1px solid #2d2a40;color:#a78bfa;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;margin-top:8px;font-family:inherit}
.fb-speak-btn:hover{background:#1a1630}
.fb-followup{background:#0f0a1e;border:1px solid #3d1d6b;border-radius:10px;padding:12px 14px;margin-top:8px}
.fb-followup-label{font-size:10px;font-weight:700;color:#a78bfa;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.fb-followup-text{font-size:13px;color:#c4b5fd;line-height:1.6}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.skeleton{background:#141222;border-radius:8px;overflow:hidden;position:relative}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,#1e1a2e 50%,transparent 100%);background-size:600px 100%;animation:shimmer 1.4s infinite}
.sk-title{height:26px;width:55%;margin-bottom:10px}
.sk-sub{height:14px;width:38%;margin-bottom:24px}
.sk-card{background:#0f0f1a;border:1px solid #1a1828;border-radius:14px;padding:20px;margin-bottom:14px}
.sk-row{display:flex;gap:10px;margin-bottom:12px}
.sk-stat{flex:1;height:80px;border-radius:12px}
.sk-bar{height:14px;border-radius:99px;margin-bottom:10px}
.sk-bar-short{width:40%}
.sk-bar-mid{width:65%}
.sk-bar-long{width:85%}
#content{opacity:0;transition:opacity .25s ease}
#content.ready{opacity:1}
.tab-icon{font-size:13px;line-height:1}
.tab-label{font-size:11px}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr)}.tab{font-size:10px;padding:6px 8px}.page-title{font-size:18px}.stat-val{font-size:17px}.header-right{gap:5px}}
@media(max-width:480px){
  .tabs{padding:0 8px}
  .tabs-inner{gap:1px;padding:4px 0}
  .tab{padding:8px 9px;border-radius:8px;flex-direction:column;gap:2px;min-width:44px;min-height:44px;justify-content:center}
  .tab-label{display:none}
  .tab-icon{font-size:16px}
  .tab.active .tab-label{display:block;font-size:9px;color:#a78bfa;font-weight:600;letter-spacing:.02em;margin-top:1px}
  .header-right{gap:4px}
  .level-select{font-size:11px;padding:3px 6px}
  .xp-pill{display:none}
  .main{padding:16px 12px 32px}
}
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-inner">
      <div class="logo" onclick="showTab('dashboard')">
        <div class="logo-icon">F</div>
        <span class="logo-text">fluent<span>ai</span></span>
      </div>
      <div class="header-right">
        <select class="level-select" id="levelSelect" onchange="onLevelChange(this.value)">
          <option>Beginner</option><option>Basic</option><option>Pre-Intermediate</option>
          <option>Intermediate</option><option>Upper-Intermediate</option><option>Advanced</option>
        </select>
        <div class="streak-pill">🔥 <span id="streakVal">0</span></div>
        <div class="xp-pill">✦ <span id="xpVal">0</span> XP</div>
        <div class="user-pill" id="userPill" onclick="showTab('settings')">⚙</div>
      </div>
    </div>
  </header>
  <nav class="tabs"><div class="tabs-inner" id="tabsInner"></div></nav>
  <main class="main"><div class="content" id="content">
  <div class="sk-title skeleton"></div>
  <div class="sk-sub skeleton"></div>
  <div class="sk-row">
    <div class="sk-stat skeleton"></div>
    <div class="sk-stat skeleton"></div>
    <div class="sk-stat skeleton"></div>
    <div class="sk-stat skeleton"></div>
  </div>
  <div class="sk-card">
    <div class="sk-bar sk-bar-mid skeleton" style="margin-bottom:14px"></div>
    <div class="sk-bar sk-bar-long skeleton"></div>
    <div class="sk-bar sk-bar-mid skeleton"></div>
    <div class="sk-bar sk-bar-short skeleton"></div>
    <div class="sk-bar sk-bar-long skeleton"></div>
  </div>
  <div class="sk-card">
    <div class="sk-bar sk-bar-short skeleton" style="margin-bottom:14px"></div>
    <div class="sk-bar sk-bar-long skeleton"></div>
    <div class="sk-bar sk-bar-mid skeleton"></div>
  </div>
</div></main>
</div>
<div class="onboarding-overlay" id="onboarding" style="display:none">
  <div class="onboarding-card" id="onboardingCard"></div>
</div>
<script>
const LEVELS=["Beginner","Basic","Pre-Intermediate","Intermediate","Upper-Intermediate","Advanced"];
const TOPICS=["trabalho","viagem","tecnologia","família","saúde","comida","esportes","educação","natureza","entretenimento","negócios","cultura","ciência","política","arte"];
const TOPIC_EN={"trabalho":"work","viagem":"travel","tecnologia":"technology","família":"family","saúde":"health","comida":"food","esportes":"sports","educação":"education","natureza":"nature","entretenimento":"entertainment","negócios":"business","cultura":"culture","ciência":"science","política":"politics","arte":"art"};
function translateTopic(t){ return TOPIC_EN[t.trim().toLowerCase()]||t; }
const TIME_OPTIONS=[
  {total:30,l:{listening:10,reading:10,speaking:5,vocabulary:5}},
  {total:60,l:{listening:20,reading:15,speaking:15,vocabulary:10}},
  {total:90,l:{listening:30,reading:20,speaking:25,vocabulary:15}},
];

const WORD_OF_DAY={
  Beginner:[{word:"Hello",pt:"Olá",use:"Hello! My name is Ana."},{word:"Thank you",pt:"Obrigado(a)",use:"Thank you for your help!"},{word:"Please",pt:"Por favor",use:"Can you help me, please?"},{word:"Sorry",pt:"Desculpe",use:"Sorry, I don't understand."},{word:"Good",pt:"Bom/Boa",use:"It was a good day."}],
  Basic:[{word:"Actually",pt:"Na verdade",use:"Actually, I prefer tea to coffee."},{word:"Probably",pt:"Provavelmente",use:"I will probably arrive late."},{word:"Suggest",pt:"Sugerir",use:"I suggest we take a break."},{word:"Realize",pt:"Perceber",use:"I didn't realize it was so late."},{word:"Manage",pt:"Conseguir",use:"Did you manage to finish on time?"}],
  "Pre-Intermediate":[{word:"Nevertheless",pt:"No entanto",use:"It was hard. Nevertheless, we finished."},{word:"Consequently",pt:"Consequentemente",use:"He was late; consequently, he missed it."},{word:"Acknowledge",pt:"Reconhecer",use:"She acknowledged the mistake openly."},{word:"Distinct",pt:"Distinto",use:"There is a distinct difference between them."},{word:"Substantial",pt:"Substancial",use:"There was a substantial improvement."}],
  Intermediate:[{word:"Scrutinize",pt:"Examinar",use:"We need to scrutinize the data carefully."},{word:"Mitigate",pt:"Mitigar",use:"These measures mitigate the risk."},{word:"Articulate",pt:"Expressar claramente",use:"She articulated her ideas clearly."},{word:"Nuanced",pt:"Matizado",use:"His analysis was very nuanced."},{word:"Proliferate",pt:"Proliferar",use:"Smartphones have proliferated rapidly."}],
  "Upper-Intermediate":[{word:"Ostensible",pt:"Aparente",use:"The ostensible reason was budget cuts."},{word:"Substantiate",pt:"Comprovar",use:"Can you substantiate that claim?"},{word:"Circumvent",pt:"Contornar",use:"They tried to circumvent the rules."},{word:"Predicate",pt:"Basear",use:"The theory is predicated on that assumption."},{word:"Ramification",pt:"Ramificação",use:"The ramifications of this decision are serious."}],
  Advanced:[{word:"Epistemology",pt:"Epistemologia",use:"Epistemology is the study of knowledge."},{word:"Hegemony",pt:"Hegemonia",use:"Cultural hegemony shapes public opinion."},{word:"Dialectic",pt:"Dialética",use:"The dialectic between freedom and security is complex."},{word:"Pellucid",pt:"Claro/cristalino",use:"Her argument was pellucid and well-structured."},{word:"Caveat",pt:"Ressalva",use:"There is one important caveat to consider."}],
};

const SPEAKING_PROMPTS={
  Beginner:["Describe your typical morning routine.","Talk about your favorite food.","Describe your family.","What do you do on weekends?","Talk about your city or neighborhood."],
  Basic:["What did you do last weekend?","Describe your job or studies.","Talk about a movie or show you like.","What are your plans for your next vacation?","Describe your best friend."],
  "Pre-Intermediate":["Talk about a challenge you faced recently.","Describe your ideal work environment.","What are the advantages of learning English?","Talk about a book or podcast you recommend.","How has technology changed your daily life?"],
  Intermediate:["Discuss the pros and cons of social media.","Talk about a decision that changed your life.","What do you think about remote work?","Describe your career goals for the next 5 years.","How do you deal with stress?"],
  "Upper-Intermediate":["Analyze the impact of globalization on local cultures.","What are the ethical implications of AI in the workplace?","Discuss the relationship between inequality and social mobility.","How should governments balance privacy and security?","Evaluate current approaches to climate change."],
  Advanced:["Critically examine the role of media in shaping political discourse.","Discuss tensions between individual freedom and collective responsibility.","Analyze how cognitive biases affect institutional decision-making.","What are the long-term societal implications of automation?","Examine the epistemological challenges posed by the information age."],
};

const LISTENING={
  Beginner:[
    {id:1,title:"Daily Routine",text:"My name is Ana. I wake up at 7am. I eat breakfast and drink coffee. Then I go to work by bus. I work from 9 to 5. After work, I watch TV and read a book. I go to bed at 11pm.",accent:"American",questions:["What time does Ana wake up?","How does she go to work?","What does she do after work?"]},
    {id:2,title:"At the Supermarket",text:"I need to buy some things today. I need milk, eggs, and bread. I also need fruits — apples and bananas. The supermarket is near my house. It is open every day from 8am to 10pm.",accent:"British",questions:["What does the person need to buy?","Where is the supermarket?","What time does it open?"]},
  ],
  Basic:[
    {id:1,title:"Talking About the Weekend",text:"Last weekend was really fun. On Saturday, I went to the park with my family. We had a picnic and played frisbee. On Sunday, I stayed home and cooked pasta for the first time. It was delicious!",accent:"American",questions:["What did they do on Saturday?","What did they cook on Sunday?","How was the pasta?"]},
  ],
  "Pre-Intermediate":[
    {id:1,title:"Career Plans",text:"I've been thinking a lot about my career lately. I'm currently working as a marketing assistant, but I'd like to move into project management eventually. I've been taking online courses to improve my skills.",accent:"American",questions:["What is the person's current job?","What do they want to do in the future?","How are they preparing?"]},
  ],
  Intermediate:[
    {id:1,title:"Technology in Daily Life",text:"It's hard to imagine life without technology nowadays. Most people rely on their smartphones for everything — from navigation to entertainment. While this offers incredible convenience, it also raises concerns about privacy and screen time.",accent:"British",questions:["What do people rely on smartphones for?","What are two concerns mentioned?","How does technology affect focus?"]},

function loadState(){
  const raw=localStorage.getItem("fluentai_v4");
  if(raw){
    let parsed=null;
    try{ parsed=JSON.parse(raw); }catch(e){
      console.warn("FluentAI: estado corrompido.",e);
      showToast("⚠️ Dados salvos corrompidos — progresso recente pode ter sido perdido.","#f87171");
    }
    if(parsed && typeof parsed==="object"){
      const critical={
        userName:"string", level:"string", xp:"number", streak:"number",
        totalDays:"number", lastStudyDate:"string", goalMonths:"number",
        missionDate:"string", tab:"string",
      };
      const safe={};
      for(const[k,type] of Object.entries(critical)){
        if(parsed[k]!==undefined && typeof parsed[k]===type) safe[k]=parsed[k];
      }
      if(parsed.mission && typeof parsed.mission==="object" && !Array.isArray(parsed.mission)) safe.mission=parsed.mission;
      if(parsed.scores && typeof parsed.scores==="object" && !Array.isArray(parsed.scores)) safe.scores=parsed.scores;
      if(Array.isArray(parsed.savedSpeaking)) safe.savedSpeaking=parsed.savedSpeaking;
      if(parsed.studyLog && typeof parsed.studyLog==="object") safe.studyLog=parsed.studyLog;
      if(parsed.missionTimes && typeof parsed.missionTimes==="object") safe.missionTimes=parsed.missionTimes;
      if(Array.isArray(parsed.aiHistory)) safe.aiHistory=parsed.aiHistory;
      if(parsed.lisChecksMap && typeof parsed.lisChecksMap==="object") safe.lisChecksMap=parsed.lisChecksMap;
      // DECK (novo)
      if(Array.isArray(parsed.deck)) safe.deck=parsed.deck;
      safe.deckView="main"; // sempre volta pra main ao reabrir
      Object.assign(S, parsed, safe);
    }
  }
  checkDayReset();
  if(!S.savedSpeaking) S.savedSpeaking=[];
  if(!S.studyLog) S.studyLog={};
  if(!S.deck) S.deck=[];
  S.sessionAccum={listening:0,reading:0,speaking:0,vocabulary:0};
  S.sessionTime={listening:0,reading:0,speaking:0,vocabulary:0};
  S.sessionStart=null;
  S.wordCards=[]; S.themeCards=[];
  S.studyFlipped=false; S.studySessionDone=false;
}

function saveState(){
  try{
    localStorage.setItem("fluentai_v4",JSON.stringify(S));
  }catch(e){
    if(e instanceof DOMException && (e.name==="QuotaExceededError"||e.name==="NS_ERROR_DOM_QUOTA_REACHED")){
      const keys=["genListening","genListeningText","genListeningQs","genReading","genReadingQs",
                  "lessonData","speakGenPrompts","lisFeedback","readFeedback",
                  "genReadingFeedback","speakFeedback","wordCards","themeCards"];
      keys.forEach(k=>{ if(S[k]!==undefined) S[k]=Array.isArray(S[k])?[]:null; });
      try{
        localStorage.setItem("fluentai_v4",JSON.stringify(S));
        showToast("⚠️ Armazenamento quase cheio — cache da IA foi limpo.","#fcd34d");
      }catch(e2){
        showToast("❌ Armazenamento cheio! Libere espaço no navegador.","#f87171",6000);
      }
    }
  }
}

let _lastCheckedDate="";
function checkDayReset(){
  const today=new Date().toDateString();
  if(_lastCheckedDate===today) return;
  _lastCheckedDate=today;
  if(S.lastStudyDate && S.lastStudyDate!==today){
    const diff=Math.floor((new Date()-new Date(S.lastStudyDate))/864e5);
    if(diff>1 && S.streak>0){ S.streak=0; saveState(); }
  }
  if(S.missionDate!==today){
    S.mission={listening:false,reading:false,speaking:false,vocabulary:false};
    S.missionDate=today;
    S.speakRound=0; S.speakHistory=[]; S.speakFeedback=null; S.speakInput="";
    S.sessionTime={listening:0,reading:0,speaking:0,vocabulary:0};
    S.sessionAccum={listening:0,reading:0,speaking:0,vocabulary:0};
    saveState();
  }
}

function logStudy(tab){
  const today=new Date().toDateString();
  if(!S.studyLog[today]) S.studyLog[today]={};
  S.studyLog[today][tab]=(S.studyLog[today][tab]||0)+1;
}

function addXP(n){
  S.xp+=n;
  const today=new Date().toDateString();
  if(S.lastStudyDate!==today){
    const last=S.lastStudyDate?new Date(S.lastStudyDate):null;
    const diff=last?Math.floor((new Date()-last)/864e5):99;
    S.streak=diff<=1?S.streak+1:1;
    S.lastStudyDate=today;
    S.totalDays++;
    _lastCheckedDate=today;
  }
  document.getElementById("xpVal").textContent=S.xp;
  document.getElementById("streakVal").textContent=S.streak;
  saveState();
}

function completeTask(task){
  if(S.mission[task]) return;
  S.mission[task]=true; addXP(25);
  S.scores[task]=Math.min(100,S.scores[task]+3);
  logStudy(task);
  saveState();
  const mc=Object.values(S.mission).filter(Boolean).length;
  if(mc===4){ addXP(75); S.tab="dashboard"; }
  render();
}

const synth=window.speechSynthesis||null;
let recognition=null,isRecording=false;
function speak(text,rate){
  if(!synth||!text) return; synth.cancel();
  const u=new SpeechSynthesisUtterance(String(text).substring(0,400));
  u.lang="en-US"; u.rate=rate||1;
  const vs=synth.getVoices();
  const v=vs.find(v=>v.lang==="en-US"&&v.name.includes("Google"))||vs.find(v=>v.lang==="en-US")||vs[0];
  if(v) u.voice=v; synth.speak(u);
}

function speakWithCallback(text,rate,onEnd){
  if(!synth||!text) return; synth.cancel();
  const u=new SpeechSynthesisUtterance(String(text).substring(0,400));
  u.lang="en-US"; u.rate=rate||1;
  const vs=synth.getVoices();
  const v=vs.find(v=>v.lang==="en-US"&&v.name.includes("Google"))||vs.find(v=>v.lang==="en-US")||vs[0];
  if(v) u.voice=v;
  if(onEnd) u.onend=onEnd;
  synth.speak(u);
}

function startShadow(text,rate){
  if(!synth||!text) return;
  S.shadowActive=false; render();
  speakWithCallback(text,rate,()=>{
    S.shadowActive=true; S.shadowCountdown=3; render();
    const iv=setInterval(()=>{
      S.shadowCountdown--;
      if(S.shadowCountdown<=0){ clearInterval(iv); S.shadowActive=false; S.shadowCountdown=0; render(); }
      else render();
    },1000);
  });
}

function initRec(onResult,onEnd){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  const r=new SR(); r.lang="en-US"; r.continuous=true; r.interimResults=false;
  r.onresult=e=>{const t=Array.from(e.results).map(r=>r[0].transcript).join(" "); onResult(t);};
  r.onend=()=>{ if(isRecording){try{r.start();}catch(e){}} else onEnd(); };
  r.onerror=()=>{ isRecording=false; onEnd(); };
  return r;
}
function toggleRec(inputId,statusId,btnId){
  if(isRecording){
    isRecording=false; if(recognition) recognition.stop();
    const b=document.getElementById(btnId); if(b){b.className="voice-btn voice-idle";b.textContent="🎤";}
    const s=document.getElementById(statusId); if(s) s.textContent="Gravação encerrada.";
    return;
  }
  recognition=initRec(txt=>{
    const inp=document.getElementById(inputId);
    if(inp){inp.value+=(inp.value?" ":"")+txt;}
  },()=>{});
  if(!recognition) return;
  isRecording=true; recognition.start();
  const b=document.getElementById(btnId); if(b){b.className="voice-btn voice-recording";b.textContent="⏹";}
  const s=document.getElementById(statusId); if(s) s.textContent="🔴 Gravando... fale em inglês";
}

let timerInterval=null;
function startTimer(tab){
  stopTimer();
  S.currentTimerTab=tab; S.sessionStart=Date.now();
  timerInterval=setInterval(()=>{
    if(!S.sessionStart) return;
    const elapsed=S.sessionAccum[tab]+Math.floor((Date.now()-S.sessionStart)/1000);
    S.sessionTime[tab]=elapsed;
    const el=document.getElementById("sessionTimerFill");
    const lbl=document.getElementById("sessionTimerLabel");
    const target=(S.missionTimes[tab]||15)*60;
    const pct=Math.min(100,Math.round((elapsed/target)*100));
    if(el) el.style.width=pct+"%";
    if(lbl) lbl.textContent=formatTime(elapsed)+" / "+S.missionTimes[tab]+"min";
  },1000);
}
function stopTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  if(S.sessionStart&&S.currentTimerTab){
    const elapsed=Math.floor((Date.now()-S.sessionStart)/1000);
    S.sessionAccum[S.currentTimerTab]=(S.sessionAccum[S.currentTimerTab]||0)+elapsed;
    S.sessionTime[S.currentTimerTab]=S.sessionAccum[S.currentTimerTab];
  }
  S.sessionStart=null;
}
function formatTime(s){ return Math.floor(s/60)+":"+(s%60).toString().padStart(2,"0"); }

async function callAI(messages,level){
  const TIMEOUT_MS=15000;
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),TIMEOUT_MS);
  try{
    const res=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages,level:level||S.level}),
      signal:ctrl.signal,
    });
    clearTimeout(timer);
    const d=await res.json();
    if(res.status===429) throw Object.assign(new Error(d.error||"rate_limit"),{code:"RATE_LIMIT"});
    if(!res.ok||d.error) throw Object.assign(new Error(d.error||"api_error"),{code:"API_ERROR"});
    return d.reply;
  }catch(e){
    clearTimeout(timer);
    if(e.name==="AbortError") throw Object.assign(new Error("⏱ A IA demorou demais. Tente novamente."),{code:"TIMEOUT"});
    if(e.code==="RATE_LIMIT"||e.message.includes("429")) throw Object.assign(new Error("⏳ Muitas requisições. Aguarde e tente novamente."),{code:"RATE_LIMIT"});
    if(e.code==="API_ERROR") throw e;
    throw Object.assign(new Error("❌ Erro de conexão. Tente novamente."),{code:"UNKNOWN"});
  }
}

function greeting(){
  const h=new Date().getHours(),name=S.userName?`, ${S.userName}`:"";
  return h<12?`Bom dia${name}! ☀️`:h<18?`Boa tarde${name}! 🌤`:`Boa noite${name}! 🌙`;
}
function globalPct(){ if(!S.goalMonths) return 0; const raw=Math.round((S.totalDays/(S.goalMonths*30))*100); return Math.min(100,S.xp>0?Math.max(1,raw):raw); }
function getWordOfDay(){ const a=WORD_OF_DAY[S.level]||WORD_OF_DAY.Beginner; return a[new Date().getDate()%a.length]; }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function getActiveTopic(selKey,customKey){ const custom=(S[customKey]||"").trim(); return custom||S[selKey]||""; }

function timerWidget(tabKey){
  const target=(S.missionTimes[tabKey]||15)*60;

  const pct=Math.min(100,Math.round((elapsed/target)*100));
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;background:#0c0c18;padding:10px 14px;border-radius:10px;border:1px solid #1a1828">

  </div>`;
}

function topicSelector(selKey,customKey,placeholder,genBtnId){

async function startLesson(topic){
  S.lessonTopic=topic; S.lessonStep=0; S.lessonData=null; S.lessonLoading=true; S.lessonSpeakInput=""; render();
  try{
    const p=`You are an EFL content creator. Create a structured English lesson about "${topic}" for ${S.level} level.\n\nCRITICAL: The topic may be in Portuguese — translate it to English first.\n- "text": 100% in English\n- "vocab": each "word" and "sentence" in English, "pt" is Portuguese translation\n- "speakPrompt": a question in English\n\nVOCABULARY RULE: ${LV_VOCAB[S.level]}\n\nReturn ONLY valid JSON:\n{"text":"[80-100 word spoken-English passage]","vocab":[{"word":"...","pt":"...","sentence":"...","sentencePt":"..."},{"word":"...","pt":"...","sentence":"...","sentencePt":"..."},{"word":"...","pt":"...","sentence":"...","sentencePt":"..."}],"speakPrompt":"[English question about the topic]"}`;
    const r=await callAI([{role:"user",content:p}]);
    S.lessonData=JSON.parse(cleanJson(r));
  }catch(e){
    S.lessonData={text:e.message||"Erro ao gerar lição.",vocab:[],speakPrompt:"Describe what you know about "+topic};
    showToast(e.message||"Erro ao gerar lição. Tente novamente.","#f87171");
  }
  S.lessonLoading=false; render();
}

async function submitLessonSpeaking(){
  const ta=document.getElementById("lessonSpeakArea");
  const text=ta?ta.value.trim():"";
  if(!text||text.length<5) return;
  S.lessonLoading=true; render();
  try{
    const p=`You are an EFL teacher. Student level: ${S.level}. Topic: "${S.lessonTopic}".\n\nThe student was asked: "${S.lessonData.speakPrompt}"\nThe student's response: "${text}"\n\nProvide feedback:\n✅ Corrected: [corrected version in English]\n💡 More natural: [how a native would say it]\n📝 Rule: [one grammar rule in ${LANG(S.level)}, max 1 sentence]\n🗣️ Your turn: [a NEW follow-up question in English]\n\nNEVER correct or rewrite the original question. ONLY correct the student's response.`;
    S.lessonData.speakFeedback=await callAI([{role:"user",content:p}]);
  }catch(e){
    S.lessonData.speakFeedback=null;
    showToast(e.message||"Erro ao processar. Tente novamente.","#f87171");
  }
  S.lessonLoading=false; render();
}

function parseSpeakFeedback(raw){
  if(!raw) return null;
  const sections={corrected:"",natural:"",pronunciation:"",learned:"",followup:""};
  const patterns=[
    {key:"corrected",re:/✅\s*CORRECTED[:\s]*([\s\S]*?)(?=💡|🔊|📝|🗣️|$)/i},
    {key:"natural",re:/💡\s*MORE NATURAL[:\s]*([\s\S]*?)(?=🔊|📝|🗣️|$)/i},
    {key:"pronunciation",re:/🔊\s*PRONUNCIATION TIP[:\s]*([\s\S]*?)(?=📝|🗣️|$)/i},
    {key:"learned",re:/📝\s*WHAT(?:\s+YOU)?\s*(?:LEARNED|NOTICED)[:\s]*([\s\S]*?)(?=🗣️|$)/i},
    {key:"followup",re:/🗣️\s*NOW YOU[:\s]*([\s\S]*?)$/i},
  ];
  for(const p of patterns){ const m=raw.match(p.re); if(m) sections[p.key]=m[1].trim(); }
  const hasAny=Object.values(sections).some(v=>v.length>0);
  return hasAny?sections:null;
}

function renderReadingFeedback(raw){
  if(!raw) return "";
  const lines=raw.split("\n");
  let html="",inBlock=false,blockLines=[];
  const flushBlock=()=>{
    if(!blockLines.length) return;
    const joined=blockLines.join("\n").trim();
    if(!joined) return;
    const isOk=joined.includes("✅");
    const color=isOk?"#059669":"#dc2626";
    html+=`<div style="padding:10px 13px;border-radius:9px;background:#0a0a15;border-left:3px solid ${color};margin-bottom:9px;font-size:13px;line-height:1.7;color:#e2e0f0;white-space:pre-wrap">${esc(joined)}</div>`;
    blockLines=[];
  };
  for(const line of lines){
    if(/^\[Q\d\]|^Q\d[\.\):\s]/i.test(line.trim())||/^(Question|Pergunta)\s*\d/i.test(line.trim())){
      flushBlock(); inBlock=true; blockLines=[line];
    } else if(inBlock){ blockLines.push(line); }
    else{ if(line.trim()) html+=`<div style="font-size:13px;color:#a78bfa;line-height:1.7;margin-bottom:4px">${esc(line)}</div>`; }
  }
  flushBlock();
  if(!html) html=`<div style="font-size:13px;line-height:1.7;white-space:pre-wrap;color:#d1fae5">${esc(raw)}</div>`;
  return html;
}

function getDueCards(){
  const now=Date.now();
  return S.deck.filter(c=>!c.srs||c.srs.nextReview<=now||c.srs.status==="new");
}

function addCardsToDeck(cards,source,keyword){
  if(!S.deck) S.deck=[];
  let count=0;
  cards.forEach(c=>{
    const id=9000+Date.now()+Math.floor(Math.random()*1000)+count;
    S.deck.push({
      id,front:c.front,back:c.back,highlight:c.highlight||keyword||"",
      source,keyword:keyword||"",level:S.level,addedAt:Date.now(),
      srs:{ease:2.5,interval:1,reps:0,status:"new",nextReview:Date.now(),lastReview:null}
    });
    count++;
  });
  saveState();
  return count;
}

function buildStudyQueue(){
  const due=getDueCards();
  due.sort((a,b)=>{
    if(a.srs.status==="new"&&b.srs.status!=="new") return -1;
    if(b.srs.status==="new"&&a.srs.status!=="new") return 1;
    return (a.srs.nextReview||0)-(b.srs.nextReview||0);
  });
  S.studyQueue=due.map(c=>c.id);
  S.studyIdx=0; S.studyFlipped=false; S.studySessionDone=false;
}

function srsCompute(id,quality){
  const now=Date.now(),day=864e5;
  const card=S.deck.find(c=>c.id===id);
  const prev=card?card.srs:{ease:2.5,interval:1,reps:0};
  let{ease,interval,reps}=prev;
  if(quality<3){reps=0;interval=1;}
  else{
    if(reps===0) interval=1;
    else if(reps===1) interval=6;
    else interval=Math.round(interval*ease);
    reps++;
    ease=ease+(0.1-(5-quality)*(0.08+(5-quality)*0.02));
    if(ease<1.3) ease=1.3;
    if(ease>2.5) ease=2.5;
  }
  const status=quality>=4?"learned":reps===0?"new":"learning";
  return{ease,interval,reps,status,nextReview:now+(interval*day),lastReview:now,quality};
}

function studyAnswer(difficulty){
  const qualityMap={hard:1,medium:3,easy:5};
  const id=S.studyQueue[S.studyIdx];
  const card=S.deck.find(c=>c.id===id);
  if(!card) return;
  card.srs=srsCompute(id,qualityMap[difficulty]||3);
  const dayLabel=card.srs.interval===1?"amanhã":card.srs.interval===6?"em 6 dias":"em "+card.srs.interval+" dias";
  const colorMap={hard:"#f87171",medium:"#fcd34d",easy:"#6ee7b7"};
  const iconMap={hard:"😰",medium:"🤔",easy:"😊"};
  showToast(iconMap[difficulty]+" Próxima revisão: "+dayLabel,colorMap[difficulty],2500);
  if(S.studyIdx<S.studyQueue.length-1){ S.studyIdx++; S.studyFlipped=false; }
  else{ S.studySessionDone=true; completeTask("vocabulary"); }
  saveState(); render();
}

function deleteCard(id){
  S.deck=S.deck.filter(c=>c.id!==id);
  saveState(); render();
}

async function generateWordCards(){
  const word=translateTopic((S.wordInput||"").trim());
  if(!word||S.wordLoading) return;
  S.wordLoading=true; S.wordCards=[]; render();
  try{
    const raw=await callAI([{role:"user",content:P_VOCAB_WORD_CARDS(word,S.level)}]);
    S.wordCards=JSON.parse(cleanJson(raw)).map(c=>({...c,selected:true}));
  }catch(e){ showToast(e.message||"Erro ao gerar cards.","#f87171"); }
  finally{ S.wordLoading=false; render(); }
}

async function generateThemeCards(theme){
  const topic=translateTopic(theme||(S.lisTopic?translateTopic(S.lisTopic):"")|(S.lisTopicCustom||"").trim()||"daily life");
  S.themeLoading=true; S.themeCards=[]; render();
  try{
    const raw=await callAI([{role:"user",content:P_VOCAB_THEME_CARDS(topic,S.level)}]);
    S.themeCards=JSON.parse(cleanJson(raw)).map(c=>({...c,selected:true}));
  }catch(e){ showToast(e.message||"Erro ao gerar cards.","#f87171"); }
  finally{ S.themeLoading=false; render(); }
}

function addSelectedToDeck(sourceArray,source,keyword){
  const selected=sourceArray.filter(c=>c.selected);
  if(!selected.length){ showToast("Selecione pelo menos 1 card!","#f59e0b"); return; }
  const n=addCardsToDeck(selected,source,keyword);
  showToast(`✓ ${n} card${n>1?"s":""} adicionado${n>1?"s":""} ao baralho!`,"#6ee7b7");
  if(source==="ai_word"){S.wordCards=[];S.wordInput="";}
  if(source==="ai_theme"){S.themeCards=[];}
  S.deckView="main"; render();
}

function addManualCard(){
  const front=(S.manualFront||"").trim();
  const back=(S.manualBack||"").trim();
  if(!front||!back){showToast("Preencha a frase e a tradução!","#f59e0b");return;}
  addCardsToDeck([{front,back,highlight:""}],"manual","");
  S.manualFront=""; S.manualBack="";
  showToast("✓ Card adicionado ao baralho!","#6ee7b7"); render();
}

function renderStudySession(){
  if(S.studySessionDone){

  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="S.deckView='main';S.studySessionDone=false;render()">← Voltar ao baralho</button>
    <button class="btn btn-secondary" onclick="S.deckView='add';S.addTab='word';render()">+ Adicionar mais cards</button>
  </div>
</div>`;
  }
  const id=S.studyQueue[S.studyIdx];
  const card=S.deck.find(c=>c.id===id);
  if(!card) return `<div style="text-align:center;padding:40px;color:#555">Card não encontrado. <button class="btn btn-secondary" onclick="S.deckView='main';render()">← Voltar</button></div>`;
  const total=S.studyQueue.length;
  const pct=Math.round((S.studyIdx/Math.max(total,1))*100);
  const previewInterval=(quality)=>{
    const p=card.srs||{ease:2.5,interval:1,reps:0};
    const ease=p.ease||2.5, interval=p.interval||1, reps=p.reps||0;
    // Difícil sempre reinicia
    if(quality<3) return "amanhã";
    // Cards novos: mostrar intervalos distintos (como Anki learning steps)
    if(reps===0){
      if(quality>=5) return "4 dias";   // Fácil
      return "1 dia";                    // Médio
    }
    if(reps===1){
      if(quality>=5) return "6 dias";
      return "3 dias";
    }
    // Cards em revisão: calcular pelo ease
    let e=ease+(0.1-(5-quality)*(0.08+(5-quality)*0.02));
    if(e<1.3) e=1.3;
    const iv=Math.round(interval*e);
    return iv<=1?"amanhã":iv+"d";
  };
  return `
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
  <button class="btn btn-secondary btn-sm" onclick="S.deckView='main';S.studyFlipped=false;render()">← Sair</button>

  <div style="font-size:10px;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px">${S.studyFlipped?"🇧🇷 Tradução":"🇺🇸 Inglês — clique em Mostrar resposta"}</div>
  ${!S.studyFlipped?`
    <div style="font-size:20px;font-weight:700;color:#e2e0f0;line-height:1.4;margin-bottom:16px">${esc(card.front)}</div>
    ${card.highlight?`<span style="font-size:12px;background:#1e1a2e;color:#a78bfa;padding:4px 12px;border-radius:6px">🔑 ${esc(card.highlight)}</span>`:""}
  `:`
    <div style="font-size:18px;font-weight:600;color:#c4b5fd;line-height:1.5;margin-bottom:12px">${esc(card.back)}</div>
    <div style="font-size:13px;color:#6b7280;font-style:italic;border-top:1px solid #1a1828;padding-top:12px;margin-top:4px;width:100%">${esc(card.front)}</div>
  `}
</div>
${!S.studyFlipped?`
<button class="btn btn-primary" style="font-size:15px;padding:12px 32px;width:100%;justify-content:center" onclick="S.studyFlipped=true;speak('${(card.front||"").replace(/'/g,"\\'")}');render()">
  Mostrar resposta
</button>
`:`
<div>
  <div style="font-size:12px;color:#6b7280;text-align:center;margin-bottom:12px">Você lembrou?</div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-hard" style="flex:1;flex-direction:column;gap:3px;padding:12px 8px" onclick="studyAnswer('hard')">
      😰 Difícil<br><span style="font-size:10px;opacity:.8">${previewInterval(1)}</span>
    </button>
    <button class="btn btn-medium" style="flex:1;flex-direction:column;gap:3px;padding:12px 8px" onclick="studyAnswer('medium')">
      🤔 Médio<br><span style="font-size:10px;opacity:.8">${previewInterval(3)}</span>
    </button>
    <button class="btn btn-easy" style="flex:1;flex-direction:column;gap:3px;padding:12px 8px" onclick="studyAnswer('easy')">
      😊 Fácil<br><span style="font-size:10px;opacity:.8">${previewInterval(5)}</span>
    </button>
  </div>
  <button class="btn btn-secondary btn-sm" style="margin-top:10px;width:100%;justify-content:center" onclick="speak('${(card.front||"").replace(/'/g,"\\'")}')">🔊 Ouvir novamente</button>
</div>
`}`;

function renderAI(){
  return `
<div class="page-title">✦ AI Coach</div>
<div class="page-sub">Seu tutor pessoal de inglês. Corrija frases, tire dúvidas ou converse.</div>
<div class="chat-area" id="chatArea">
  ${S.aiHistory.length===0?`<div style="text-align:center;padding:36px 16px;color:#555;margin:auto"><div style="font-size:30px;margin-bottom:10px">✦</div><div style="font-weight:600;color:#777;margin-bottom:6px">AI Coach — nível ${S.level}</div><div style="font-size:12px">Envie uma frase para correção, peça exercícios ou inicie uma conversa.</div></div>`
  :S.aiHistory.map(m=>`<div style="display:flex;justify-content:${m.role==="user"?"flex-end":"flex-start"}"><div class="bubble ${m.role==="user"?"bubble-user":"bubble-ai"}">${esc(m.content)}${m.role==="assistant"?`<button class="bubble-speak-btn" onclick="speak('${(m.content||"").replace(/'/g,"\\'").replace(/\n/g," ").substring(0,300)}')" title="Ouvir">🔊</button>`:""}</div></div>`).join("")}
  ${S.aiLoading?`<div style="display:flex"><div class="bubble bubble-ai" style="color:#555;font-style:italic">Pensando...</div></div>`:""}
</div>
<div style="display:flex;gap:9px;align-items:flex-end">
  <textarea class="inp" id="aiTextarea" rows="2" placeholder="Escreva uma frase, faça uma pergunta ou peça um exercício..." style="resize:none;flex:1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAIMessage()}"
    oninput="S.aiInput=this.value">${esc(S.aiInput)}</textarea>
  ${window.SpeechRecognition||window.webkitSpeechRecognition?`<button class="voice-btn voice-idle" id="aiMic" onclick="toggleRec('aiTextarea','aiStatus','aiMic')">🎤</button>`:""}
  <button class="btn btn-primary" onclick="sendAIMessage()" style="align-self:flex-end;min-width:70px;justify-content:center" ${S.aiLoading?"disabled":""}>${S.aiLoading?"...":"Enviar ✦"}</button>
</div>
<div id="aiStatus" style="font-size:11px;color:#444;margin-top:5px">Enter para enviar · Shift+Enter para nova linha</div>
${S.aiHistory.length>0?`<button class="btn btn-secondary btn-sm" style="margin-top:8px;color:#f87171;border-color:#450a0a" onclick="S.aiHistory=[];saveState();render()">✕ Limpar conversa</button>`:""}`;
}

function setAIInput(txt){ S.aiInput=txt; S.tab="ai"; render(); const ta=document.getElementById("aiTextarea"); if(ta){ta.value=txt;ta.focus();} }

async function sendAIMessage(){
  const ta=document.getElementById("aiTextarea");
  const msg=(ta?ta.value:S.aiInput).trim();
  if(!msg||S.aiLoading) return;
  S.aiInput=""; S.aiLoading=true;
  S.aiHistory.push({role:"user",content:msg});
  render();
  setTimeout(()=>{const ca=document.getElementById("chatArea");if(ca)ca.scrollTop=ca.scrollHeight;},50);
  try{
    const reply=await callAI([{role:"system",content:P_AI_COACH_SYSTEM(S.level)},...S.aiHistory.slice(-14)]);
    S.aiHistory.push({role:"assistant",content:reply});
  }catch(e){
    S.aiHistory.push({role:"assistant",content:e.message||"❌ Erro de conexão."});
  }
  S.aiLoading=false; saveState(); render();
  setTimeout(()=>{const ca=document.getElementById("chatArea");if(ca)ca.scrollTop=ca.scrollHeight;},50);
}

// ══════════════════════════════════════════════════════════════════
// EVOLUÇÃO
// ══════════════════════════════════════════════════════════════════
function renderEvolucao(){
  const last30=Array.from({length:30},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-29+i);
    const key=d.toDateString();
    const log=S.studyLog[key]||{};
    const modules=Object.keys(log).length;
    const isToday=i===29;
    return{key,modules,isToday,day:d.getDate(),month:d.getMonth()+1,weekday:["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()]};
  });
  const daysStudied=last30.filter(d=>d.modules>0).length;
  const avgModules=daysStudied>0?(last30.reduce((a,d)=>a+d.modules,0)/daysStudied).toFixed(1):0;
  const bestStreak=(()=>{let max=0,cur=0;last30.forEach(d=>{if(d.modules>0){cur++;max=Math.max(max,cur);}else cur=0;});return max;})();
  const maxModules=Math.max(...last30.map(d=>d.modules),1);
  const totalCards=S.deck.length;
  const learned=S.deck.filter(c=>c.srs&&c.srs.status==="learned").length;
  return `
<div class="page-title">📈 Minha Evolução</div>
<div class="page-sub">Acompanhe seu progresso real ao longo do tempo.</div>
<div class="stats-grid">
  ${[{v:daysStudied,l:"Dias estudados",s:"últimos 30 dias"},{v:S.streak,l:"Streak atual",s:"dias seguidos"},{v:bestStreak,l:"Melhor streak",s:"últimos 30 dias"},{v:avgModules,l:"Módulos/dia",s:"média dos dias ativos"}].map(s=>`<div class="stat-card"><div class="stat-val">${s.v}</div><div class="stat-label">${s.l}</div><div class="stat-sub">${s.s}</div></div>`).join("")}
</div>
<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:16px">Atividade nos últimos 30 dias</div>
  <div style="display:flex;align-items:flex-end;gap:3px;height:80px;margin-bottom:8px">
    ${last30.map(d=>{
      const h=d.modules===0?4:Math.max(12,Math.round((d.modules/maxModules)*80));
      const color=d.isToday?"#a78bfa":d.modules>0?"#5b21b6":"#1a1828";
      const border=d.isToday?"2px solid #a78bfa":"none";
      return `<div style="flex:1;height:${h}px;background:${color};border-radius:3px;border:${border}" title="${d.weekday} ${d.day}/${d.month}: ${d.modules} módulos"></div>`;
    }).join("")}
  </div>
</div>
<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:16px">Vocabulário</div>
  ${[{l:"Cards no baralho",v:totalCards,c:"#a78bfa"},{l:"Dominadas",v:learned,c:"#6ee7b7"},{l:"Em revisão",v:totalCards-learned,c:"#fcd34d"}].map(s=>`<div class="perf-bar"><div class="perf-label">${s.l}</div><div class="progress-wrap" style="flex:1;background:#0c0c18"><div style="height:100%;border-radius:99px;background:${s.c};width:${totalCards>0?Math.round((s.v/Math.max(totalCards,1))*100):0}%;transition:width .5s"></div></div><div class="perf-pct" style="color:${s.c};width:40px">${s.v}</div></div>`).join("")}
</div>
<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:16px">Performance por módulo</div>
  ${[{k:"listening",l:"Listening",c:"#8b5cf6"},{k:"speaking",l:"Speaking",c:"#f59e0b"},{k:"reading",l:"Reading",c:"#10b981"},{k:"vocabulary",l:"Vocabulary",c:"#3b82f6"}].map(s=>`<div class="perf-bar"><div class="perf-label">${s.l}</div><div class="progress-wrap" style="flex:1;background:#0c0c18"><div style="height:100%;border-radius:99px;background:${s.c};width:${S.scores[s.k]}%;transition:width .5s"></div></div><div class="perf-pct">${S.scores[s.k]}%</div></div>`).join("")}
</div>`;
}

// SETTINGS
// ══════════════════════════════════════════════════════════════════
function renderSettings(){
  const totalMin=Object.values(S.missionTimes).reduce((a,b)=>a+b,0);
  const goalLabel=S.goalMonths===0?"No meu ritmo":S.goalMonths===1?"1 mês":S.goalMonths+" meses";
  return `
<div class="page-title">⚙ Configurações</div>
<div class="page-sub">Personalize sua experiência de aprendizado.</div>
<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:14px">👤 Seu perfil</div>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
    <input class="inp" id="nameInput" placeholder="Seu nome..." value="${esc(S.userName)}" style="flex:1"/>
    <button class="btn btn-secondary" onclick="saveName()">Salvar</button>
  </div>
  <div style="font-size:12px;color:#6b7280">Nível atual: <span style="color:#a78bfa;font-weight:600">${S.level}</span> · XP total: <span style="color:#a78bfa;font-weight:600">${S.xp}</span> · Streak: <span style="color:#fcd34d;font-weight:600">${S.streak}🔥</span></div>
</div>
<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:14px">⏱ Tempo de estudo diário</div>
  <div style="font-size:12px;color:#6b7280;margin-bottom:12px">Total atual: <span style="color:#a78bfa;font-weight:600">${totalMin} minutos/dia</span></div>
  <div style="display:flex;flex-direction:column;gap:7px;margin-bottom:12px">
    ${TIME_OPTIONS.map((o,i)=>`<button class="goal-btn${totalMin===o.total&&!S.missionTimeCustom?" sel":""}" onclick="S.missionTimes=${JSON.stringify(o.l)};S.missionTimeCustom='';saveState();render()">${o.total} minutos por dia</button>`).join("")}
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <input class="inp-number" id="totalTimeInput" type="number" min="15" max="300" placeholder="Outro..." value="${esc(S.missionTimeCustom)}"/>
    <span style="font-size:12px;color:#6b7280">minutos</span>
    <button class="btn btn-secondary" onclick="applyCustomTime()">Aplicar</button>
  </div>
</div>
<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:14px">🎯 Meta de fluência</div>
  <div style="font-size:12px;color:#6b7280;margin-bottom:12px">Meta atual: <span style="color:#a78bfa;font-weight:600">${goalLabel}</span></div>
  <div style="display:flex;flex-direction:column;gap:7px">
    ${[{v:2,l:"Resultado rápido (2 meses)"},{v:3,l:"Acelerado (3 meses)"},{v:6,l:"Sólido (6 meses)"},{v:12,l:"Fluência completa (12 meses)"},{v:0,l:"No meu ritmo"}].map(o=>`<button class="goal-btn${S.goalMonths===o.v?" sel":""}" onclick="S.goalMonths=${o.v};saveState();render()">${o.l}</button>`).join("")}
  </div>
</div>
<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:6px">⚠️ Zona de perigo</div>
  <div style="font-size:12px;color:#6b7280;margin-bottom:14px">Ações irreversíveis.</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn" style="background:#1a0a0a;color:#f87171;border:1px solid #450a0a;font-size:13px;padding:7px 14px" onclick="if(confirm('Resetar TODO o progresso? Isso não pode ser desfeito.')){localStorage.removeItem('fluentai_v4');location.reload();}">🗑 Resetar tudo</button>
    <button class="btn btn-secondary" onclick="showOnboarding()">↺ Refazer onboarding</button>
  </div>
</div>`;
}

function applyCustomTime(){
  const inp=document.getElementById("totalTimeInput");
  const total=parseInt(inp?.value||60);
  if(!total||total<15) return;
  S.missionTimes={listening:Math.round(total*.33),reading:Math.round(total*.25),speaking:Math.round(total*.25),vocabulary:Math.round(total*.17)};
  S.missionTimeCustom=String(total); saveState(); render();
}
function saveName(){ const inp=document.getElementById("nameInput"); if(inp&&inp.value.trim()){S.userName=inp.value.trim();saveState();render();} }
function onLevelChange(lv){ S.level=lv; document.getElementById("levelSelect").value=lv; saveState(); render(); }

function requestNotification(){
  if(!("Notification" in window)){ alert("Seu browser não suporta notificações."); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted"){
      S.reminderEnabled=true; saveState(); render();
      new Notification("FluentAI 🎓",{body:"Lembrete ativado para as "+S.reminderHour+"h!"});
    } else { alert("Permissão negada. Ative nas configurações do browser."); }
  });
}

// ══════════════════════════════════════════════════════════════════
// ONBOARDING
// ══════════════════════════════════════════════════════════════════
function showOnboarding(){
  S.onboardStep=0; S.onboardAnswers={};
  document.getElementById("onboarding").style.display="flex";
  renderOnboarding();
}

function renderOnboarding(){
  const q=OB_QUESTIONS[S.onboardStep];
  const card=document.getElementById("onboardingCard"); if(!card) return;
  const realSteps=OB_QUESTIONS.length-1;
  const realStep=Math.max(0,S.onboardStep-1);
  const pct=q.type==="intro"?0:Math.round((realStep/realSteps)*100);
  const isLast=S.onboardStep===OB_QUESTIONS.length-1;
  let inner=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#a78bfa">fluent<span style="color:#e2e0f0">ai</span></span>
    ${q.type==="intro"?'<span style="font-size:11px;color:#555;background:#14121e;padding:2px 8px;border-radius:99px">Bem-vindo!</span>':`<span style="font-size:12px;color:#555">${realStep+1} / ${realSteps}</span>`}
  </div>
  <div class="progress-wrap" style="margin-bottom:22px"><div class="progress-bar" style="width:${pct}%;transition:width .4s"></div></div>`;
  if(q.type==="intro"){
    inner+=`<div style="text-align:center;margin-bottom:22px"><div style="font-size:42px;margin-bottom:12px">🎓</div><div style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:#e2e0f0;margin-bottom:8px">Aprenda inglês de verdade<br>com IA adaptativa</div><div style="font-size:13px;color:#888;line-height:1.7;max-width:340px;margin:0 auto">O FluentAI usa IA para criar conteúdo personalizado de Listening, Speaking, Reading e Vocabulário — todo dia, no seu nível.</div></div>`;
  } else {
    inner+=`<div style="font-size:18px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-bottom:18px;line-height:1.4">${q.q}</div>`;
    if(q.type==="name") inner+=`<input class="inp" id="obName" placeholder="${q.placeholder}" value="${esc(S.onboardAnswers.name||"")}" style="margin-bottom:16px" onkeydown="if(event.key==='Enter')obNext()"/>`;
    else if(q.type==="level") inner+=`<div style="display:flex;flex-direction:column;gap:7px;margin-bottom:16px">${q.options.map(o=>`<button class="goal-btn${S.onboardAnswers.level===o?" sel":""}" onclick="S.onboardAnswers.level='${o}';renderOnboarding()">${o}</button>`).join("")}</div>`;
    else if(q.type==="goal") inner+=`<div style="display:flex;flex-direction:column;gap:7px;margin-bottom:16px">${q.options.map(o=>`<button class="goal-btn${S.onboardAnswers.goalMonths===o.v?" sel":""}" onclick="S.onboardAnswers.goalMonths=${o.v};renderOnboarding()">${o.l}</button>`).join("")}</div>`;
    else if(q.type==="time") inner+=`<div style="display:flex;flex-direction:column;gap:7px;margin-bottom:16px">${TIME_OPTIONS.map((o,i)=>`<button class="goal-btn${S.onboardAnswers.timeIdx===i?" sel":""}" onclick="S.onboardAnswers.timeIdx=${i};S.onboardAnswers.time=${o.total};renderOnboarding()">${o.total} minutos por dia</button>`).join("")}</div>`;
  }
  const canNext=q.type==="intro"||q.type==="name"||(q.type==="level"&&S.onboardAnswers.level)||(q.type==="goal"&&S.onboardAnswers.goalMonths!==undefined)||(q.type==="time"&&S.onboardAnswers.time);
  const btnLabel=q.type==="intro"?"Personalizar meu plano →":isLast?"Começar a aprender! 🚀":"Continuar →";
  inner+=`<button class="btn btn-primary" style="width:100%;justify-content:center" onclick="obNext()" ${!canNext?"disabled":""}>${btnLabel}</button>`;
  card.innerHTML=inner;
  if(q.type==="name"){ const inp=document.getElementById("obName"); if(inp) setTimeout(()=>inp.focus(),50); }
}

function obNext(){
  const q=OB_QUESTIONS[S.onboardStep];
  if(q.type==="name"){const inp=document.getElementById("obName");S.onboardAnswers.name=inp?inp.value.trim():"";}
  S.onboardStep++;
  if(S.onboardStep>=OB_QUESTIONS.length){
    if(S.onboardAnswers.name) S.userName=S.onboardAnswers.name;
    if(S.onboardAnswers.level) S.level=S.onboardAnswers.level;
    if(S.onboardAnswers.goalMonths!==undefined) S.goalMonths=S.onboardAnswers.goalMonths;
    if(S.onboardAnswers.timeIdx>=0&&S.onboardAnswers.timeIdx!==undefined) S.missionTimes=TIME_OPTIONS[S.onboardAnswers.timeIdx].l;
    S.totalDays=1; S.lastStudyDate=new Date().toDateString(); S.streak=1;
    saveState(); document.getElementById("onboarding").style.display="none"; render();
  } else renderOnboarding();
}

if(synth) synth.onvoiceschanged=()=>synth.getVoices();
loadState();
const isFirst=!S.userName&&S.totalDays===0;
render();
setInterval(checkDayReset,60_000);
requestAnimationFrame(()=>{ const el=document.getElementById("content"); if(el) el.classList.add("ready"); });
if(isFirst) showOnboarding();
if(["listening","speaking","reading","vocabulary"].includes(S.tab)) startTimer(S.tab);
</script>
